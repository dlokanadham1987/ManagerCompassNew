<section class="view">
  <div class="panel-head">When to hand off to a human</div>
  <div class="esc-wrap">
    <table class="esc-table">
      <thead><tr><th>Topic</th><th>Escalate to HR when&hellip;</th><th>Contact</th></tr></thead>
      <tbody>
        <tr *ngFor="let t of topics">
          <td><span class="esc-topic" [style.color]="t.color"><app-topic-icon [kind]="t.key" [size]="15" [color]="t.color"></app-topic-icon>{{ t.label }}</span></td>
          <td>{{ t.escalation }}</td>
          <td class="esc-contact">
            <span>{{ t.contact }}</span>
            <span class="esc-actions">
              <a
                class="esc-icon-btn"
                [href]="contactAction(t).href"
                [attr.aria-label]="contactAction(t).label"
                [title]="contactAction(t).label">
                <svg *ngIf="contactAction(t).kind === 'mail'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2"/>
                  <path d="M3 7l9 6 9-6"/>
                </svg>
                <svg *ngIf="contactAction(t).kind === 'tel'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.11 4.18 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.72c.13.98.36 1.94.68 2.86a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.22-1.22a2 2 0 0 1 2.11-.45c.92.32 1.88.55 2.86.68A2 2 0 0 1 22 16.92z"/>
                </svg>
                <svg *ngIf="contactAction(t).kind === 'link'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                </svg>
              </a>
              <button
                type="button"
                class="esc-icon-btn"
                title="Copy contact to clipboard"
                aria-label="Copy contact to clipboard"
                (click)="copyContact(t)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="9" y="9" width="13" height="13" rx="2"/>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                </svg>
                <span class="esc-copy-feedback" *ngIf="copiedKey === t.key">Copied</span>
              </button>
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <p class="wide-note">Every row above is a standing guardrail, not a suggestion &mdash; Manager Compass never makes the call itself on pay, performance, legal, or employment matters.</p>
</section>
